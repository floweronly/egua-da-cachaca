# Gera o APK do app sempre que você enviar uma mudança para o GitHub.
# O arquivo pronto aparece em "Releases" (lado direito da página do repositório).
# Os passos de compilação ficam em ci/build.sh, dentro do projeto.zip.
name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Abrir o projeto (projeto.zip)
        run: |
          unzip -q projeto.zip
          cp -r egua-da-cachaca/. .
          rm -rf egua-da-cachaca

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar e publicar o APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/build.sh
